# CI — the gate everything else hangs off.
#
# Until now the only thing running the tests was whoever was at the keyboard.
# That was survivable while merges were hand-driven and is not once a merge can
# reach www.noschnitz.com without someone watching, so this runs on every PR
# and on master, and is the check the merge rules require.
#
# `npm test` is 29 suites run concurrently by scripts/runtests.mjs, ~36s on a
# 4-core box; the job is dominated by checkout and `npm ci`. (This comment
# claimed "18 harnesses and ~10s" for a long time after both numbers stopped
# being true, then "26 suites, ~35s" while the real figure was 71s — the
# rendertest weight had gone stale and mis-ordered the pool. If you change what
# the suite costs, change this line, because it is what the next person budgets
# against.)
#
# Nothing here needs secrets — storetest falls back to the in-memory store when
# no Upstash credentials are present, which is what happens on CI.
name: CI

on:
  pull_request:
  push:
    branches: [master]
  # Actions has been observed taking twenty minutes and four pushes to queue a
  # run on a session-authored PR, and a check that never starts blocks a merge
  # exactly as hard as a red one. Without this there is nothing to re-trigger:
  # a missing run cannot be re-run, only replaced by another push. Two lines to
  # make that self-service.
  workflow_dispatch:

# A second push to the same branch makes the first run irrelevant. master is
# excluded from cancellation because Release keys off its completed run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  test:
    name: lint, tests, build
    runs-on: ubuntu-latest

    # THE JOB TIMEOUT IS A QUEUE BUDGET, NOT A TEST BUDGET, and getting that
    # backwards cost four red runs on 2026-08-06 — two of them on master, which
    # per CLAUDE.md means the beta deploy was silently withheld twice.
    #
    # What happened: runs 131, 132, 134 and 135 each burnt exactly 15.0-15.1
    # minutes and reported `cancelled`. That reads as "the tests hung", and it
    # is not what happened. The tests never ran. Each of those jobs has
    # `runner_id: 0`, an empty `runner_name`, and NO steps array at all in the
    # API — they sat waiting for a runner and were cancelled at the
    # `timeout-minutes: 15` mark without ever being assigned one. Run 133, in
    # the middle of them, got a runner and went green in 2.1 minutes on the same
    # code. The suite was ~52s throughout.
    #
    # So the job-level bound has to sit above any plausible queue wait, or a
    # busy Actions pool presents itself as a test failure. The real bound on
    # execution moved to the steps below: a step's timeout starts when the STEP
    # starts, so queue time cannot eat it.
    #
    # HOW TO TELL THE TWO APART next time, without guessing: look at the job in
    # the API (or at whether the web UI shows any steps at all).
    #   no steps + runner_id 0  -> never scheduled. Nothing is wrong with the
    #                              repo. Re-run it.
    #   steps, one of them red  -> a real failure; read that step.
    #   steps, one of them hung -> `npm test` names the wedged suite itself now
    #                              (see the watchdog in scripts/runtests.mjs).
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        timeout-minutes: 10
        run: npm ci

      # Lint used to run here as its own step AND again inside `npm test`, so it
      # ran twice every build. The reason for the separate step was good — a
      # lint error should report as a lint error, not as an anonymous failed
      # test run — and it survives without the duplication: lint is one of the
      # suites the runner schedules, and the runner names the suite that failed
      # and prints its output on its own. It also now overlaps with the rest
      # instead of holding everything else up for its ~3s.
      #
      # 10 minutes against a measured ~30s (52s before 0.59.2). The generous
      # margin is deliberate: scripts/runtests.mjs already kills and NAMES an
      # individual wedged suite well inside this, so if this bound is ever the
      # thing that fires, the problem is the whole runner and not one suite.
      - name: Tests
        timeout-minutes: 10
        run: npm test

      # The bundle is what actually ships, and a build that fails is invisible
      # to every harness above — none of them touch Vite.
      - name: Build
        timeout-minutes: 10
        run: npm run build
