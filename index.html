<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0C2B20" />
    <title>Sheepshead — No Schnitz!</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        background: #0C2B20;
        overflow: hidden;
        overscroll-behavior: none;
      }
      #root { height: 100%; }

      /* Dealing. A new hand used to arrive with the cards already fanned out in
         front of you, which reads as a screen redrawing rather than a hand
         being dealt. Each card now slides up from the middle of the table and
         settles, one after another.

         Kept in CSS rather than driven from React: it runs on the compositor,
         so a phone mid-deal is not also re-rendering six times. The stagger is
         an inline animation-delay per card — see HandFan. */
      @keyframes deal-in {
        from {
          opacity: 0;
          /* Up toward the felt and slightly small, so it reads as coming from
             the table rather than sliding in from off-screen. */
          transform: translateY(-190px) scale(0.82) rotate(var(--deal-tilt, -4deg));
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1) rotate(0deg);
        }
      }

      /* Anyone who has asked not to be moved gets the hand without the flight. */
      @media (prefers-reduced-motion: reduce) {
        @keyframes deal-in {
          from { opacity: 0; }
          to { opacity: 1; }
        }
      }

      /* A played card lands pulled in from its own seat, so a trick reads as
         who played what in order rather than cards appearing already in
         place. Direction is per-card (see felt.jsx's SEAT_DIR) via
         --play-dx/--play-dy; the keyframe itself doesn't know which seat. */
      @keyframes play-in {
        from {
          opacity: 0;
          transform: translate(var(--play-dx, 0px), var(--play-dy, 0px)) scale(0.8);
        }
        to {
          opacity: 1;
          transform: translate(0, 0) scale(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        @keyframes play-in {
          from { opacity: 0; }
          to { opacity: 1; }
        }
      }

      /* A finished trick gathers toward the winner's seat instead of cutting
         to nothing. Direction is per-card (see felt.jsx's SEAT_DIR, keyed by
         the WINNER's seat so all five cards converge on one corner) via
         --sweep-dx/--sweep-dy. */
      @keyframes sweep-out {
        from {
          opacity: 1;
          transform: translate(0, 0) scale(1);
        }
        to {
          opacity: 0;
          transform: translate(var(--sweep-dx, 0px), var(--sweep-dy, 0px)) scale(0.5);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        @keyframes sweep-out {
          from { opacity: 1; }
          to { opacity: 0; }
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
